<div id="wrap"><canvas id="c" aria-label="Juego CENIZA"></canvas>
  <div id="ui">

<script>
(() => {
'use strict';
// ================================================================ setup
const W = 960, H = 540, GROUND = 440;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1;
const dpr = Math.min(window.devicePixelRatio || 1, 2);
function resize() {
  const vw = innerWidth, vh = innerHeight, pad = vw < 700 ? 0 : 24;
  scale = Math.min((vw - pad) / W, (vh - pad) / H);
  cv.style.width = (W * scale) + 'px'; cv.style.height = (H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', () => { resize(); buildLayers(); });
resize();
const TOUCH = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (TOUCH) document.body.classList.add('touch');
const QS = new URLSearchParams(location.search);
const DEMO = QS.has('demo');

const bg = new Image(); bg.src = 'bg.jpg';
const bgTitle = new Image(); bgTitle.src = 'bg-title.jpg';
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// painted machine: bg.jpg (1776x888) scaled so the painted wanderer sits below the ground line
const BG_S = (H / 888) * 1.1, BG_W = 1776 * BG_S, BG_X0 = (W - BG_W) / 2, BG_Y0 = -16;
const EYE0 = { x: BG_X0 + 1080 * BG_S, y: BG_Y0 + 334 * BG_S };
const PAN = 20;
let bgLayer = null, vigLayer = null, shardSprite = null, slowLayer = null;
function layerCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * scale * dpr)); c.height = Math.max(1, Math.round(h * scale * dpr));
  const x = c.getContext('2d'); x.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0); return [c, x];
}
function buildLayers() {
  const [b, bx] = layerCanvas(W + PAN * 2, H);
  bx.fillStyle = '#120c09'; bx.fillRect(0, 0, W + PAN * 2, H);
  if (bg.complete && bg.naturalWidth) bx.drawImage(bg, BG_X0 + PAN, BG_Y0, BG_W, 888 * BG_S);
  const gg = bx.createLinearGradient(0, GROUND - 50, 0, H); gg.addColorStop(0, 'rgba(0,0,0,0)'); gg.addColorStop(.35, 'rgba(10,7,5,.92)'); gg.addColorStop(1, 'rgba(6,4,3,1)');
  bx.fillStyle = gg; bx.fillRect(0, GROUND - 50, W + PAN * 2, H);
  bx.fillStyle = 'rgba(10,7,5,.96)'; bx.fillRect(0, GROUND, W + PAN * 2, H - GROUND);
  for (let i = 0; i < 260; i++) { bx.fillStyle = `rgba(${120 + Math.random() * 60},${90 + Math.random() * 40},${70 + Math.random() * 30},${Math.random() * .25})`; bx.fillRect(Math.random() * (W + PAN * 2), GROUND + Math.random() * (H - GROUND), 2, 1); }
  bx.strokeStyle = 'rgba(226,55,42,.4)'; bx.lineWidth = 1; bx.beginPath(); bx.moveTo(0, GROUND + .5); bx.lineTo(W + PAN * 2, GROUND + .5); bx.stroke();
  bgLayer = b;
  const [v, vx] = layerCanvas(W, H);
  const vg = vx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.6)');
  vx.fillStyle = vg; vx.fillRect(0, 0, W, H); vigLayer = v;
  const [sl, slx] = layerCanvas(W, H);
  const sg = slx.createRadialGradient(W / 2, H / 2, H * .25, W / 2, H / 2, H * .8); sg.addColorStop(0, 'rgba(120,200,255,0)'); sg.addColorStop(1, 'rgba(120,200,255,.28)');
  slx.fillStyle = sg; slx.fillRect(0, 0, W, H); slowLayer = sl;
  const [s, sx] = layerCanvas(40, 40);
  sx.translate(20, 20); sx.shadowColor = '#ffb066'; sx.shadowBlur = 14;
  const g = sx.createLinearGradient(0, -9, 0, 9); g.addColorStop(0, '#fff0d0'); g.addColorStop(1, '#e06b2d');
  sx.fillStyle = g; sx.beginPath(); sx.moveTo(0, -10); sx.lineTo(7, 0); sx.lineTo(0, 10); sx.lineTo(-7, 0); sx.closePath(); sx.fill(); shardSprite = s;
}
bg.addEventListener('load', buildLayers);
buildLayers();

// ================================================================ audio (synthesised, no files)
let actx = null, master = null, muted = store.get('ceniza-muted', false);
const muteBtn = document.getElementById('mute');
const setMuteLabel = () => (muteBtn.textContent = muted ? '♪ OFF' : '♪ ON');
setMuteLabel();
muteBtn.addEventListener('click', e => { e.stopPropagation(); muted = !muted; store.set('ceniza-muted', muted); if (master) master.gain.value = muted ? 0 : .32; setMuteLabel(); });
function audio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = muted ? 0 : .32; master.connect(actx.destination); } catch { actx = null; }
}
function tone(type, f0, f1, dur, vol = .4, delay = 0) {
  if (!actx) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol = .4, freq = 900, delay = 0) {
  if (!actx) return;
  const t = actx.currentTime + delay, n = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  f.type = 'lowpass'; f.frequency.value = freq; s.buffer = buf; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
const sfx = {
  jump: () => tone('square', 320, 620, .12, .12),
  jump2: () => { tone('square', 480, 900, .12, .12); tone('triangle', 900, 1400, .1, .08, .03); },
  dash: () => { tone('sawtooth', 700, 120, .18, .1); noise(.15, .12, 2400); },
  perfect: () => { [0, .05, .1].forEach((d, i) => tone('triangle', 900 + i * 300, 1600 + i * 300, .25, .16, d)); noise(.3, .08, 6000); },
  pick: c => { tone('triangle', 660 + c * 40, 990 + c * 60, .09, .22); tone('triangle', 990 + c * 60, 1320 + c * 60, .1, .14, .06); },
  charge: () => tone('sine', 140, 520, .8, .07),
  beam: () => { tone('sawtooth', 90, 60, .5, .12); noise(.4, .12, 700); },
  boom: () => { noise(.45, .4, 500); tone('sine', 120, 40, .4, .3); },
  hit: () => { noise(.3, .45, 1600); tone('square', 220, 70, .3, .18); },
  wave: () => tone('sine', 70, 40, .6, .25),
  drone: () => tone('square', 900, 1300, .08, .05),
  kill: () => { noise(.25, .3, 2200); tone('square', 600, 1800, .12, .12); },
  power: () => [0, .07, .14, .21].forEach((d, i) => tone('triangle', 500 + i * 160, 700 + i * 200, .12, .16, d)),
  slash: () => { noise(.35, .25, 4000); tone('sawtooth', 300, 1500, .3, .12); },
  core: () => { noise(.5, .45, 800); tone('sine', 160, 50, .6, .35); },
  stun: () => { noise(.9, .5, 400); [0, .15, .3].forEach((d, i) => tone('triangle', 330 * (i + 1), 220 * (i + 1), .6, .18, d)); },
  ready: () => [0, .08].forEach((d, i) => tone('sine', 700 + i * 350, 900 + i * 350, .15, .14, d)),
  over: () => [0, .18, .36].forEach((d, i) => tone('sawtooth', 300 - i * 70, 120 - i * 30, .35, .14, d)),
  swing: () => { noise(.12, .16, 5200); tone('triangle', 900, 300, .1, .07); },
  bow: () => { tone('square', 1400, 500, .08, .06); tone('sine', 700, 1200, .06, .05); },
  slam: () => { noise(.4, .45, 380); tone('sine', 90, 35, .45, .35); },
  zap: () => { noise(.18, .18, 7000); tone('sawtooth', 1800, 200, .16, .08); },
  hitE: () => tone('square', 260, 120, .06, .09),
  crit: () => { tone('square', 900, 1800, .08, .11); noise(.1, .14, 6000); },
  buy: () => [0, .06, .12].forEach((d, i) => tone('triangle', 520 + i * 260, 780 + i * 260, .14, .16, d)),
  deny: () => tone('square', 160, 110, .18, .12),
  roar: () => { noise(1.1, .45, 300); tone('sawtooth', 70, 40, 1.1, .2); },
  chest: () => [0, .08, .16, .24, .32].forEach((d, i) => tone('triangle', 600 + i * 150, 900 + i * 200, .16, .15, d)),
  revive: () => [0, .12, .24].forEach((d, i) => tone('sine', 300 * (i + 1), 600 * (i + 1), .5, .18, d)),
  click: () => tone('triangle', 700, 900, .05, .08),
};

// ================================================================ input
const keys = new Set(), pressed = new Set(), codes = new Set();
const map = { ArrowLeft: 'L', KeyA: 'L', ArrowRight: 'R', KeyD: 'R', ArrowUp: 'J', KeyW: 'J', Space: 'J', ArrowDown: 'Dn', KeyS: 'Dn',
  ShiftLeft: 'D', ShiftRight: 'D', KeyX: 'D', KeyK: 'D', KeyE: 'C', KeyC: 'C', KeyL: 'C', KeyJ: 'A', KeyZ: 'A', KeyF: 'A',
  KeyP: 'P', Escape: 'P', KeyM: 'M', Enter: 'S', KeyR: 'Rt', KeyT: 'T', Digit1: '1', Digit2: '2', Digit3: '3', Digit4: '4' };
addEventListener('keydown', e => {
  const k = map[e.code]; if (!k) return;
  e.preventDefault(); audio();
  if (!e.repeat || e.code.startsWith('Arrow')) codes.add(e.code);
  if (!keys.has(k)) pressed.add(k);
  keys.add(k);
  if (k === 'M') muteBtn.click();
});
addEventListener('keyup', e => { const k = map[e.code]; if (k) keys.delete(k); });
const hold = (id, k) => {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); e.stopPropagation(); audio(); if (!keys.has(k)) pressed.add(k); keys.add(k); el.classList.add('on'); };
  const off = e => { e.preventDefault(); keys.delete(k); el.classList.remove('on'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
};
hold('bL', 'L'); hold('bR', 'R'); hold('bJ', 'J'); hold('bA', 'A'); hold('bD', 'D'); hold('bC', 'C');
const btnC = document.getElementById('bC');
let pointer = null, pointerMoved = false, mouseAtk = false;
const clicks = [];
function canvasPos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H, touch: e.pointerType !== 'mouse' }; }
cv.addEventListener('pointerdown', e => {
  audio(); const q = canvasPos(e); pointer = q; clicks.push(q);
  if (mode === 'play') { pressed.add('A'); keys.add('A'); mouseAtk = true; }
});
const endPointer = () => { if (mouseAtk) { keys.delete('A'); mouseAtk = false; } };
cv.addEventListener('pointerup', endPointer); cv.addEventListener('pointerleave', endPointer); cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { pointer = canvasPos(e); pointerMoved = true; } });

// ================================================================ helpers
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function segDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, l = dx * dx + dy * dy || 1;
  const t = clamp(((px - x1) * dx + (py - y1) * dy) / l, 0, 1);
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}
const hexA = (hex, a) => `rgba(${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)},${a})`;
const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ================================================================ data: weapons, skill tree, run upgrades
const WEAPONS = {
  hoja:     { name: 'HOJA', full: 'Hoja de chatarra', col: '#f3e9d8', icon: 'blade', unlock: null, desc: 'Combo de 3 cortes rápidos; el tercero lanza una onda. Desvía balas enemigas.' },
  arco:     { name: 'ARCO', full: 'Arco de plasma', col: '#9ad8ff', icon: 'bow', unlock: 'w_arco', desc: 'Disparos con autoapuntado. Si no hay enemigos cerca, apunta al núcleo del coloso.' },
  martillo: { name: 'MARTILLO', full: 'Martillo sísmico', col: '#ff8a4c', icon: 'hammer', unlock: 'w_martillo', desc: 'Lento y brutal: ondas de choque por el suelo. En el aire cae en picada.' },
  lanza:    { name: 'LANZA', full: 'Lanza de arco', col: '#c7b0ff', icon: 'spear', unlock: 'w_lanza', desc: 'Rayo perforante que salta entre enemigos cercanos y destruye balas.' },
};
const WKEYS = ['hoja', 'arco', 'martillo', 'lanza'];
const yesNo = l => (l ? 'sí' : 'no');
const TREE = [
  { id: 'vit', name: 'VITALIDAD', col: '#e2372a', nodes: [
    { id: 'vida', name: 'Coraza', icon: 'heart', max: 3, base: 40, g: 2.3, label: 'Vidas máximas', fx: l => 3 + l },
    { id: 'regen', name: 'Reparación', icon: 'plus', max: 3, base: 90, g: 2.1, label: 'Recupera 1 vida cada', fx: l => (l ? [75, 55, 40][l - 1] + ' s' : 'nunca') },
    { id: 'escudo', name: 'Placa inicial', icon: 'shield', max: 1, base: 160, label: 'Escudo al empezar', fx: yesNo, note: 'El escudo absorbe un golpe completo.' },
    { id: 'fenix', name: 'Segunda chispa', icon: 'flame', max: 1, base: 500, label: 'Revivir una vez por partida', fx: yesNo, note: 'Al caer vuelves con 2 vidas e invulnerable un momento.' },
  ] },
  { id: 'mov', name: 'MOVILIDAD', col: '#9ad8ff', nodes: [
    { id: 'veloc', name: 'Zancada', icon: 'chev', max: 3, base: 35, g: 1.9, label: 'Velocidad', fx: l => `${100 + 8 * l}%` },
    { id: 'recarga', name: 'Recarga', icon: 'clock', max: 3, base: 60, g: 2, label: 'Recarga del dash', fx: l => `${(CHARGE_T * (1 - .12 * l)).toFixed(2)} s` },
    { id: 'carga', name: 'Turbina', icon: 'bolt', max: 2, base: 120, g: 2.6, label: 'Cargas de dash', fx: l => 2 + l },
    { id: 'salto', name: 'Triple salto', icon: 'up', max: 1, base: 200, label: 'Saltos en el aire', fx: l => 1 + l },
    { id: 'embestida', name: 'Embestida', icon: 'spike', max: 3, base: 150, g: 1.9, label: 'Daño del dash', fx: l => [0, 15, 25, 35][l], note: 'Atravesar enemigos con el dash también los daña.' },
  ] },
  { id: 'ofe', name: 'OFENSIVA', col: '#ffcf8a', nodes: [
    { id: 'filo', name: 'Filo', icon: 'blade', max: 5, base: 30, g: 1.6, label: 'Daño', fx: l => `+${15 * l}%` },
    { id: 'cadencia', name: 'Cadencia', icon: 'gear', max: 3, base: 70, g: 1.9, label: 'Velocidad de ataque', fx: l => `+${10 * l}%` },
    { id: 'crit', name: 'Punto débil', icon: 'eye', max: 4, base: 80, g: 1.7, label: 'Crítico (daño x2)', fx: l => `${5 + 6 * l}%` },
    { id: 'corte', name: 'Corte mayor', icon: 'star', max: 3, base: 110, g: 2, label: 'Daño del CORTE', fx: l => `+${25 * l}%`, note: 'La barra del CORTE también se llena 15% más rápido por nivel.' },
  ] },
  { id: 'ars', name: 'ARSENAL', col: '#ff8a4c', nodes: [
    { id: 'w_arco', name: 'Arco de plasma', icon: 'bow', max: 1, base: 100, label: 'Arma', fx: l => (l ? 'desbloqueada' : 'bloqueada'), note: WEAPONS.arco.desc },
    { id: 'w_martillo', name: 'Martillo sísmico', icon: 'hammer', max: 1, base: 220, label: 'Arma', fx: l => (l ? 'desbloqueada' : 'bloqueada'), note: WEAPONS.martillo.desc },
    { id: 'w_lanza', name: 'Lanza de arco', icon: 'spear', max: 1, base: 400, label: 'Arma', fx: l => (l ? 'desbloqueada' : 'bloqueada'), note: WEAPONS.lanza.desc },
    { id: 'maestria', name: 'Maestría', icon: 'crown', max: 3, base: 180, g: 2, label: 'Maestría de armas', fx: l => `nivel ${l}`, note: '+10% daño por nivel. Hoja +20% alcance, arco +1 disparo, martillo +25% área, lanza +1 salto.' },
  ] },
  { id: 'for', name: 'FORTUNA', col: '#d9c3a0', nodes: [
    { id: 'iman', name: 'Imán', icon: 'magnet', max: 3, base: 30, g: 1.8, label: 'Radio de recogida', fx: l => `${24 + 45 * l} px` },
    { id: 'refineria', name: 'Refinería', icon: 'core', max: 5, base: 60, g: 1.7, label: 'Núcleos al caer', fx: l => `+${15 * l}%` },
    { id: 'botin', name: 'Botín', icon: 'gift', max: 3, base: 90, g: 1.9, label: 'Power-ups y vidas', fx: l => `+${25 * l}%` },
    { id: 'cofre', name: 'Cofre inicial', icon: 'chest', max: 1, base: 350, label: 'Mejora de cofre al empezar', fx: yesNo },
  ] },
];
const UPG = [
  { id: 'dmg', name: 'FURIA DE ACERO', desc: '+25% de daño', icon: 'blade', col: '#ffcf8a' },
  { id: 'spd', name: 'ENGRANAJES', desc: '+20% de velocidad de ataque', icon: 'gear', col: '#ffcf8a' },
  { id: 'life', name: 'PLACAS NUEVAS', desc: '+1 vida máxima y te cura una vida', icon: 'heart', col: '#e2372a', max: 3 },

      if (t.k === 'debris' || t.k === 'drone' || t.o.dashMark === p.dashId) continue;
      if (Math.hypot(px - t.x, py - t.y) < t.r + 20) { t.o.dashMark = p.dashId; damage(t, Math.round(P.dashDmg * P.dmg), false, p.dashDir); }
    }
  }
  // regeneration
  if (P.regen && S.lives < P.maxLives) {
    S.regenT += dt;
    if (S.regenT >= P.regen) { S.regenT = 0; S.lives++; popText(px, py - 50, '+1 VIDA · REPARACIÓN', '#f3e9d8', 14); sfx.power(); ring(px, py, '243,233,216', 60, .5, 3); }
  } else S.regenT = 0;

  // ---- spawners (paused while the colossus is stunned; calmer while a mid-boss fights)
  const mbOn = !!S.mb;
  for (const k in S.next) S.next[k] -= dt;
  if (b.stun <= 0) {
    if (S.next.laser <= 0) { spawnLaser(); S.next.laser = rnd(1.8, 3.0) / Math.sqrt(d) * (mbOn ? 1.9 : 1); }
    if (S.next.debris <= 0) { spawnDebris(); S.next.debris = rnd(1.4, 2.6) / Math.sqrt(d) * (mbOn ? 1.6 : 1); }
    if (!mbOn && S.next.wave <= 0 && S.t > 8) { spawnWave(); S.next.wave = rnd(7, 11) / Math.sqrt(d); }
    if (!mbOn && S.next.drone <= 0) { spawnDrone(); if (S.t > 70 && Math.random() < .4) spawnDrone(); S.next.drone = rnd(5, 8) / Math.sqrt(d); }
    if (S.next.crawler <= 0) { if (!mbOn || Math.random() < .35) spawnCrawler(); if (S.t > 90 && Math.random() < .35) spawnCrawler(); S.next.crawler = rnd(4, 6.5) / Math.sqrt(d); }
    if (!mbOn && !S.chest && S.next.boss <= 0) spawnMidBoss();
  }
  if (S.next.shard <= 0) { spawnShard(); S.next.shard = rnd(.8, 1.5); }
  if (S.next.heart <= 0) { if (S.lives < P.maxLives) S.hearts.push({ x: rnd(60, W - 60), y: -20, vy: 70 }); S.next.heart = rnd(35, 50) / P.loot; }
  if (S.next.power <= 0) { spawnPower(); S.next.power = rnd(28, 40) / P.loot; }

  // ---- lasers (they also burn crawlers)
  const eye = eyePos();
  for (const l of S.lasers) {
    l.t += dt;
    if (l.t > l.warn && !l.fired) { l.fired = true; sfx.beam(); shake = Math.max(shake, 6); if (l.kind === 'lock') burst(l.x, GROUND, '#ff5a2a', 26, 260); }
    if (l.fired) {
      const k = (l.t - l.warn) / l.fire;
      const gx = l.kind === 'lock' ? l.x : lerp(l.a, l.b, clamp(k, 0, 1));
      l.gx = gx;
      if (k <= 1) {
        if (segDist(px, py, eye.x, eye.y, gx, GROUND) < 17) hurt(px, py);
        for (const c of S.crawlers) if (!c.dead && segDist(c.x, c.y - 12, eye.x, eye.y, gx, GROUND) < 20) kill({ k: 'crawler', o: c, x: c.x, y: c.y - 12, r: 18 });
        if (Math.random() < .7) S.parts.push({ x: gx + rnd(-6, 6), y: GROUND - 2, vx: rnd(-90, 90), vy: rnd(-200, -60), life: .5, t: 0, col: Math.random() < .5 ? '#ff6a2b' : '#ffd08a', r: rnd(1, 2.5) });
      }
    }
  }
  S.lasers = S.lasers.filter(l => l.t < l.warn + l.fire + .15);

  // ---- debris (a dash or any weapon shatters them)
  for (const de of S.debris) {
    if (de.dead) continue;
    de.vy += 420 * dt; de.y += de.vy * dt; de.rot += de.vr * dt;
    if (Math.hypot(px - de.x, py - de.y) < de.r + 12) {
      if (p.dashT > 0) { de.dead = true; burst(de.x, de.y, '#cfb08a', 20, 260); spawnShard(de.x, Math.min(de.y, GROUND - 30)); perfect(de.x, de.y); }
      else { hurt(de.x, de.y); de.dead = true; burst(de.x, de.y, '#9a8a74', 16, 200); }
    }
    if (de.y >= GROUND - de.r * .5) { de.dead = true; burst(de.x, GROUND - 4, '#9a8a74', 14, 220, .6); sfx.boom(); shake = Math.max(shake, 5); }
  }
  S.debris = S.debris.filter(x => !x.dead);

  // ---- shockwaves
  for (const w of S.waves) {
    if (w.warn > 0) { w.warn -= dt; continue; }
    w.x += w.dir * w.v * dt;
    if (Math.abs(px - w.x) < 16 && p.y > GROUND - w.h) hurt(w.x, GROUND - 10);
    if (Math.random() < .9) S.parts.push({ x: w.x, y: GROUND - rnd(0, w.h), vx: -w.dir * rnd(20, 80), vy: rnd(-120, -30), life: .5, t: 0, col: '#cfc6bb', r: rnd(1, 2.4) });
  }
  S.waves = S.waves.filter(w => w.x > -60 && w.x < W + 60);

  // ---- drones: patrol, lock on, dive. A dash destroys them instantly.
  for (const dr of S.drones) {
    if (dr.dead) continue;
    dr.t += dt; dr.hitT = Math.max(0, dr.hitT - dt);
    if (dr.state === 'patrol') {
      dr.x += dr.vx * dt; dr.y += Math.sin(dr.t * 3 + dr.wob) * 30 * dt;
      if (dr.t > dr.diveAt) { dr.state = 'aim'; dr.t = 0; sfx.drone(); }
    } else if (dr.state === 'aim') {
      dr.tx = px; dr.ty = py;
      if (dr.t > .55) { dr.state = 'dive'; const a = Math.atan2(dr.ty - dr.y, dr.tx - dr.x); dr.vx = Math.cos(a) * 430; dr.vy = Math.sin(a) * 430; }
    } else {
      dr.x += dr.vx * dt; dr.y += dr.vy * dt;
      if (dr.y >= GROUND - 6) { dr.dead = true; burst(dr.x, GROUND - 6, '#ff8a4c', 16, 220); sfx.boom(); if (Math.abs(px - dr.x) < 34 && p.y > GROUND - 30) hurt(dr.x, GROUND); }
    }
    if (dr.x < -60 || dr.x > W + 60 || dr.y < -80) dr.dead = true;
    if (!dr.dead && Math.hypot(px - dr.x, py - dr.y) < 22) {
      if (p.dashT > 0) { kill({ k: 'drone', o: dr, x: dr.x, y: dr.y, r: 16 }); p.charges = Math.min(P.charges, p.charges + 1); }
      else { hurt(dr.x, dr.y); dr.dead = true; burst(dr.x, dr.y, '#ff8a4c', 16, 220); }
    }
  }
  S.drones = S.drones.filter(x => !x.dead);

  // ---- crawlers: walk, crouch, lunge
  for (const c of S.crawlers) {
    if (c.dead) continue;
    c.t += dt; c.hitT = Math.max(0, c.hitT - dt); c.leg += dt * 12;
    if (c.stunT > 0) c.stunT -= dt;
    else if (c.state === 'walk') {
      c.face = Math.sign(px - c.x) || c.face;
      c.vx = lerp(c.vx, c.face * c.spd, Math.min(1, 4 * dt));
      if (Math.abs(px - c.x) < 130 && c.t > .8 && c.y >= GROUND && c.in) { c.state = 'wind'; c.t = 0; }
    } else if (c.state === 'wind') {
      c.vx *= 1 - Math.min(1, 10 * dt);
      if (c.t > .42) { c.state = 'lunge'; c.t = 0; c.vx = c.face * 400; c.vy = -320; }
    } else if (c.state === 'lunge' && c.y >= GROUND && c.t > .1) { c.state = 'walk'; c.t = 0; }
    c.vy += 1400 * dt; c.x += c.vx * dt; c.y += c.vy * dt;
    if (c.y >= GROUND) { c.y = GROUND; c.vy = 0; if (c.stunT > 0) c.vx *= 1 - Math.min(1, 8 * dt); }
    if (c.x > 12 && c.x < W - 12) c.in = true;
    if (c.in) c.x = clamp(c.x, 12, W - 12);
    if (Math.abs(px - c.x) < 22 && Math.abs(py - (c.y - 12)) < 26) hurt(c.x, c.y - 12);
  }
  S.crawlers = S.crawlers.filter(c => !c.dead);

  // ---- mid-boss, enemy bullets, lava cracks
  if (S.mb) updateMidBoss(S.mb, dt);
  for (const bl of S.bullets) {
    if (bl.dead) continue;
    bl.t += dt; bl.vy += bl.g * dt; bl.x += bl.vx * dt; bl.y += bl.vy * dt;
    if (bl.y > GROUND - 4) { bl.dead = true; burst(bl.x, GROUND - 4, bl.scrap ? '#ff6a2b' : '#ff8a4c', bl.scrap ? 16 : 6, 200, .45); if (bl.scrap) { sfx.boom(); if (Math.abs(px - bl.x) < 40 && p.y > GROUND - 30) hurt(bl.x, GROUND); } }
    if (bl.x < -30 || bl.x > W + 30 || bl.y < -60 || bl.t > bl.life) bl.dead = true;
    if (!bl.dead && Math.hypot(px - bl.x, py - bl.y) < bl.r + 10) { hurt(bl.x, bl.y); bl.dead = true; }
  }
  S.bullets = S.bullets.filter(bl => !bl.dead);
  for (const ck of S.cracks) {
    ck.t += dt;
    if (ck.t > ck.warn && !ck.fired) { ck.fired = true; sfx.boom(); burst(ck.x, GROUND, '#ff6a2b', 22, 280); }
    if (ck.fired && ck.t < ck.warn + ck.fire) {
      if (Math.abs(px - ck.x) < ck.w / 2 && p.y > GROUND - 70) hurt(ck.x, GROUND - 20);
      if (Math.random() < .9) S.parts.push({ x: ck.x + rnd(-ck.w / 2, ck.w / 2), y: GROUND, vx: rnd(-30, 30), vy: rnd(-320, -140), life: .5, t: 0, col: Math.random() < .5 ? '#ff6a2b' : '#ffd08a', r: rnd(1.5, 3) });
    }
  }
  S.cracks = S.cracks.filter(ck => ck.t < ck.warn + ck.fire + .2);

  // ---- player projectiles
  const T = targets();
  for (const s of S.pshots) {
    s.t += pdt; s.x += s.vx * pdt; s.y += s.vy * pdt;
    if (s.kind === 'bolt') { if (s.y > GROUND) s.dead = true; if (!s.dead && Math.hypot(s.x - eye.x, s.y - eye.y) < 30 && b.stun <= 0) { chipCore(s.dmg); s.dead = true; } }
    if (s.kind === 'quake' && Math.random() < .7) S.parts.push({ x: s.x, y: GROUND - rnd(0, 8), vx: rnd(-40, 40), vy: rnd(-180, -60), life: .4, t: 0, col: '#ffb38a', r: rnd(1, 2.4) });
    for (const t of T) {
      if (s.dead) break;
      if (t.o.dead || s.hit.has(t.o) || (s.ground && t.y < GROUND - 80)) continue;
      if (Math.hypot(t.x - s.x, t.y - s.y) < t.r + s.r) { s.hit.add(t.o); strike(t, s.dmg, Math.sign(s.vx)); if (!s.pierce) s.dead = true; }
    }
    if (s.kind === 'wave') for (const bl of S.bullets) if (!bl.dead && Math.hypot(bl.x - s.x, bl.y - s.y) < 26) parry(bl);
    if (s.t > s.life || s.x < -40 || s.x > W + 40 || s.y < -60) s.dead = true;
  }
  S.pshots = S.pshots.filter(s => !s.dead);
  for (const f of S.fx) f.t += dtReal;
  S.fx = S.fx.filter(f => f.t < f.dur);

  // ---- slashes travelling to the eye
  for (const s of S.slashes) {
    s.t += dtReal;
    const k = clamp(s.t / s.dur, 0, 1), it = 1 - k;
    s.x = it * it * s.x0 + 2 * it * k * s.cx + k * k * s.x1; s.y = it * it * s.y0 + 2 * it * k * s.cy + k * k * s.y1;
    s.trail.push({ x: s.x, y: s.y }); if (s.trail.length > 14) s.trail.shift();
    if (k >= 1) { s.dead = true; hitCore(); }
  }
  S.slashes = S.slashes.filter(s => !s.dead);

  // ---- shards, hearts, power-ups, chest
  S.comboT = Math.max(0, S.comboT - dt); if (S.comboT <= 0) S.combo = 0;
  for (const s of S.shards) {
    s.t += dt;
    if (s.falling) { s.y += s.vy * dt; if (s.y >= GROUND - 22) { s.y = GROUND - 22; s.falling = false; } }
    const dx = px - s.x, dy = py - s.y, dist = Math.hypot(dx, dy) || 1;
    const pull = p.magnet > 0 ? 300 : P.pickR > 24 ? P.pickR : 0;
    if (pull && dist < pull) { const v = p.magnet > 0 ? 420 : 300; s.x += dx / dist * v * dt; s.y += dy / dist * v * dt; }
    if (Math.hypot(px - s.x, py - (s.y + Math.sin(time * 3 + s.bob) * 4)) < 24) {
      s.dead = true; S.combo = Math.min(S.combo + 1, 9); S.comboT = 2.6;
      const pts = 10 * S.combo; S.score += pts; addMeter(.1 + S.combo * .006);
      popText(s.x, s.y - 14, `+${pts}${S.combo > 1 ? ' x' + S.combo : ''}`, '#ffcf8a', 14 + S.combo);
      burst(s.x, s.y, '#ffb066', 10, 140, .5); sfx.pick(S.combo);
    }
    if (s.t > s.life) s.dead = true;
  }
  S.shards = S.shards.filter(s => !s.dead);
  for (const h of S.hearts) {
    h.y = Math.min(GROUND - 22, h.y + h.vy * dt);
    if (Math.hypot(px - h.x, py - h.y) < 26) { h.dead = true; S.lives = Math.min(P.maxLives, S.lives + 1); popText(h.x, h.y - 18, '+1 VIDA', '#f3e9d8', 16); sfx.power(); burst(h.x, h.y, '#f3e9d8', 16, 160); }
  }
  S.hearts = S.hearts.filter(h => !h.dead);
  for (const u of S.powerups) {
    u.t += dt; u.y = Math.min(GROUND - 22, u.y + u.vy * dt);
    if (Math.hypot(px - u.x, py - u.y) < 28) {
      u.dead = true; sfx.power(); ring(u.x, u.y, '243,233,216', 60, .4, 3);
      if (u.kind === 'shield') { p.shield = true; popText(u.x, u.y - 22, 'ESCUDO', '#f3e9d8', 16); }
      if (u.kind === 'magnet') { p.magnet = 8; popText(u.x, u.y - 22, 'IMÁN · 8s', '#ffcf8a', 16); }
      if (u.kind === 'clock') { S.clockT = 5; popText(u.x, u.y - 22, 'TIEMPO LENTO · 5s', '#9ad8ff', 16); }
    }
    if (u.t > u.life) u.dead = true;
  }
  S.powerups = S.powerups.filter(u => !u.dead);
  if (S.chest) {
    const c = S.chest; c.t += dt;
    if (c.y < GROUND - 16) { c.vy += 900 * dt; c.y = Math.min(GROUND - 16, c.y + c.vy * dt); if (c.y >= GROUND - 16) { shake = 6; sfx.boom(); burst(c.x, GROUND - 4, '#ffcf8a', 16, 200); } }
    if (Math.hypot(px - c.x, py - c.y) < 34) { S.chest = null; burst(c.x, c.y, '#ffcf8a', 30, 260); openChoice('COFRE DEL JEFE'); }
  }

  // ---- fx
  for (const q of S.parts) { q.t += dt; if (q.wob) q.x += Math.sin(q.t * 5 + q.wob) * 16 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += (q.g ?? 380) * dt; }
  S.parts = S.parts.filter(q => q.t < q.life);
  if (S.parts.length > 600) S.parts.splice(0, S.parts.length - 600);
  for (const r of S.rings) r.t += dtReal;
  S.rings = S.rings.filter(r => r.t < r.life);
  for (const t of S.texts) t.t += dtReal;
  S.texts = S.texts.filter(t => t.t < 1.1);
  if (S.texts.length > 40) S.texts.splice(0, S.texts.length - 40);
  btnC.classList.toggle('ready', S.meter >= 1 && b.stun <= 0);
}

  step(n) { manual = true; for (let i = 0; i < n; i++) update(1 / 60); render(); },
  go(m) { if (m === 'play') startRun(); else mode = m; },
  give(n) { prog.cores += n; saveProg(); },
  boss() { if (S && !S.mb) { S.chest = null; S.boss.stun = 0; S.next.boss = 0; } },
  die() { if (S) { S.phoenixUsed = true; S.lives = 1; S.p.inv = 0; S.p.dashT = 0; S.p.shield = false; hurt(S.p.x, S.p.y); } },
};
})();

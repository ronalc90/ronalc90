name: "Pruebas de CENIZA"

# Ejecuta la suite de node (scripts/ceniza-tests y scripts/games.test.mjs) en cada push y pull request.
# La prueba de navegador (scripts/ceniza-e2e) no va aquí: necesita Chromium y se ejecuta a mano con npm run e2e.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ceniza-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Pruebas unitarias de CENIZA y de games.mjs
        run: node --test scripts/ceniza-tests/*.mjs scripts/games.test.mjs

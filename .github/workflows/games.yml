name: "Juegos: raid y libro de visitas"

# Cada jugada del perfil abre un issue con un titulo como "raid: espada" o "firma: viajero".
# Este workflow procesa todos los issues de juego abiertos, responde, los cierra y
# actualiza los SVG animados y el README.
on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: profile-games
  cancel-in-progress: false

jobs:
  play:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, 'raid') ||
      startsWith(github.event.issue.title, 'firma')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Procesar jugadas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/games.mjs

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games README.md
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Actualiza raid y libro de visitas"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin main || exit 1
            sleep $((i * 3))
          done
          exit 1
